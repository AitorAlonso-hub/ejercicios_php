<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-secondary-subtle">

    <div id="main" class="container text-center">

        <h2 class="text-primary mt-3">Calculadora</h2>

        <div class="row">

            <div class="col-md-3"></div>

            <div class="col-md-6">

                <!-- Formulario -->
                <form class="m-auto mt-5 border rounded p-3 shadow bg-white text-start"
                    action="ejercicio10.php" method="post">

                    <div class="mb-3">
                        <label for="numero1" class="form-label fw-bold">
                            Primer número:
                        </label>
                        <input type="number" name="numero1" id="numero1"
                            class="form-control" step="any" required>
                    </div>

                    <div class="mb-3">
                        <label for="operacion" class="form-label fw-bold">
                            Operador:
                        </label>

                        <select name="operacion" id="operacion"
                            class="form-select" required>

                            <option value="" selected disabled>Elige operación</option>
                            <option value="suma">+</option>
                            <option value="resta">-</option>
                            <option value="multiplicacion">*</option>
                            <option value="division">/</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="numero2" class="form-label fw-bold">
                            Segundo número:
                        </label>
                        <input type="number" name="numero2" id="numero2"
                            class="form-control" step="any" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">
                        Calcular
                    </button>

                </form>

            </div>

            <div class="col-md-3"></div>

        </div>

    </div>

</body>
</html>
